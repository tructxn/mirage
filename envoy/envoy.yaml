static_resources:
  listeners:
    # HTTP (port 80)
    - name: listener_http
      address:
        socket_address: { address: 0.0.0.0, port_value: 15001 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: wiremock }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # HTTPS (port 443) — same upstream as HTTP for now
    - name: listener_https
      address:
        socket_address: { address: 0.0.0.0, port_value: 15002 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_https
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: wiremock }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # Redis (port 6379)
    - name: listener_redis
      address:
        socket_address: { address: 0.0.0.0, port_value: 15003 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.redis_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.redis_proxy.v3.RedisProxy
                stat_prefix: egress_redis
                settings:
                  op_timeout: 5s
                prefix_routes:
                  catch_all_route:
                    cluster: redis_mock

    # Kafka (port 9092)
    - name: listener_kafka
      address:
        socket_address: { address: 0.0.0.0, port_value: 15004 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.kafka_broker
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.kafka_broker.v3.KafkaBroker
                stat_prefix: egress_kafka
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: egress_kafka_tcp
                cluster: kafka_mock

    # MySQL (port 3306)
    - name: listener_mysql
      address:
        socket_address: { address: 0.0.0.0, port_value: 15005 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.mysql_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.mysql_proxy.v3.MySQLProxy
                stat_prefix: egress_mysql
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: egress_mysql_tcp
                cluster: mysql_mock

    # AMQP (port 5672)
    - name: listener_amqp
      address:
        socket_address: { address: 0.0.0.0, port_value: 15006 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: egress_amqp
                cluster: rabbitmq_mock

  clusters:
    - name: wiremock
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: wiremock
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: wiremock, port_value: 8080 }

    - name: redis_mock
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: redis_mock
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: redis, port_value: 6380 }

    - name: kafka_mock
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: kafka_mock
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: redpanda, port_value: 9093 }

    - name: mysql_mock
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: mysql_mock
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: mysql, port_value: 3307 }

    - name: rabbitmq_mock
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: rabbitmq_mock
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: rabbitmq, port_value: 5673 }

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }
