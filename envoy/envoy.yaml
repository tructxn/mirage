static_resources:
  listeners:
    # HTTP (port 80)
    - name: listener_http
      address:
        socket_address: { address: 0.0.0.0, port_value: 15001 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: wiremock }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # HTTPS (port 443) — same upstream as HTTP for now
    - name: listener_https
      address:
        socket_address: { address: 0.0.0.0, port_value: 15002 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_https
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: wiremock }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # Redis (port 6379)
    - name: listener_redis
      address:
        socket_address: { address: 0.0.0.0, port_value: 15003 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.redis_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.redis_proxy.v3.RedisProxy
                stat_prefix: egress_redis
                settings:
                  op_timeout: 5s
                prefix_routes:
                  catch_all_route:
                    cluster: redis_mock

  clusters:
    - name: wiremock
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: wiremock
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: wiremock, port_value: 8080 }

    - name: redis_mock
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: redis_mock
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: redis, port_value: 6380 }

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }
